<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Translation Tool</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="container">
        <header>
            <h1><i class="fas fa-brain"></i> AI Translation Tool</h1>
            <p>Translate text instantly using Neural Machine Translation</p>
        </header>

        <div class="translation-container">
            <!-- Source Section -->
            <div class="language-box">
                <div class="language-header">
                    <select id="sourceLang">
                        <option value="en">English</option>
                        <option value="te">Telugu</option>
                        <option value="hi">Hindi</option>
                        <option value="ta">Tamil</option>
                        <option value="bn">Bengali</option>
                        <option value="ml">Malayalam</option>
                        <option value="kn">Kannada</option>
                        <option value="mr">Marathi</option>
                        <option value="gu">Gujarati</option>
                        <option value="es">Spanish</option>
                        <option value="fr">French</option>
                        <option value="de">German</option>
                        <option value="pt">Portuguese</option>
                        <option value="ko">Korean</option>
                        <option value="ja">Japanese</option>
                        <option value="zh">Chinese</option>
                        <option value="ar">Arabic</option>
                        <option value="ru">Russian</option>
                    </select>
                </div>
                <textarea id="sourceText" placeholder="Enter text to translate..."></textarea>
                <div class="box-footer">
                    <span id="charCount">0 chars</span>
                    <button id="speakSource" class="icon-btn"><i class="fas fa-volume-up"></i></button>
                </div>
            </div>

            <!-- Swap Button -->
            <button id="swapLanguages" class="swap-btn">
                <i class="fas fa-exchange-alt"></i>
            </button>

            <!-- Target Section -->
            <div class="language-box">
                <div class="language-header">
                    <select id="targetLang">
                        <option value="te">Telugu</option>
                        <option value="en">English</option>
                        <option value="hi">Hindi</option>
                        <option value="ta">Tamil</option>
                        <option value="bn">Bengali</option>
                        <option value="ml">Malayalam</option>
                        <option value="kn">Kannada</option>
                        <option value="mr">Marathi</option>
                        <option value="gu">Gujarati</option>
                        <option value="es">Spanish</option>
                        <option value="fr">French</option>
                        <option value="de">German</option>
                        <option value="pt">Portuguese</option>
                        <option value="ko">Korean</option>
                        <option value="ja">Japanese</option>
                        <option value="zh">Chinese</option>
                        <option value="ar">Arabic</option>
                        <option value="ru">Russian</option>
                    </select>
                </div>
                <textarea id="targetText" placeholder="Translation will appear here..." readonly></textarea>
                <div class="box-footer">
                    <span id="confidence" class="confidence-badge"></span>
                    <div class="action-buttons">
                        <button id="copyText" class="icon-btn"><i class="fas fa-copy"></i></button>
                        <button id="speakTarget" class="icon-btn"><i class="fas fa-volume-up"></i></button>
                    </div>
                </div>
            </div>
        </div>

        <div class="translate-btn-container">
            <button id="translateBtn" class="translate-btn">
                <i class="fas fa-robot"></i> Translate
            </button>
        </div>

        <!-- ML Metrics -->
        <div id="mlMetrics" class="ml-metrics">
            <div class="metric"><i class="fas fa-brain"></i><span>Model: <strong id="activeModel">-</strong></span></div>
            <div class="metric"><i class="fas fa-chart-line"></i><span>Confidence: <strong id="confidenceScore">-</strong></span></div>
            <div class="metric"><i class="fas fa-language"></i><span>Target: <strong id="detectedLang">-</strong></span></div>
        </div>

        <div id="loading" class="loading">
            <div class="spinner"></div>
            <p>AI Processing...</p>
        </div>
        <div id="errorMessage" class="error-message"></div>
    </div>
    <div id="toast" class="toast"></div>
    <script src="js/app.js"></script>
</body>
</html>
